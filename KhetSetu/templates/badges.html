{% extends "base.html" %}

{% block content %}
<div class="text-center">
    <h1 class="text-2xl font-bold mb-6 text-green-700">🎖️ Your Badges</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 justify-items-center">

        {% if "badge1.png" in unlocked %}
        <div class="bg-white shadow-lg rounded-2xl p-6 hover:scale-105 transform transition">
            <img src="{{ url_for('static', filename='images/badge1.png') }}" alt="Badge 1" class="w-32 h-32 mx-auto">
            <p class="mt-4 font-semibold">Beginner Farmer 🌱</p>
        </div>
        {% endif %}

        {% if "badge2.png" in unlocked %}
        <div class="bg-white shadow-lg rounded-2xl p-6 hover:scale-105 transform transition">
            <img src="{{ url_for('static', filename='images/badge2.png') }}" alt="Badge 2" class="w-32 h-32 mx-auto">
            <p class="mt-4 font-semibold">Eco Innovator 🌍</p>
        </div>
        {% endif %}

        {% if "badge3.png" in unlocked %}
        <div class="bg-white shadow-lg rounded-2xl p-6 hover:scale-105 transform transition">
            <img src="{{ url_for('static', filename='images/badge3.png') }}" alt="Badge 3" class="w-32 h-32 mx-auto">
            <p class="mt-4 font-semibold">Master Cultivator 🌾</p>
        </div>
        {% endif %}

    </div>
</div>
{% endblock %}
