{% extends "base.html" %}
{% block content %}
<div class="bg-white p-8 rounded-2xl shadow-lg max-w-3xl mx-auto text-center">
  <h2 class="text-2xl font-bold mb-6">Your Badges 🎖️</h2>

  {% if user_badges %}
    <div class="flex justify-center gap-8 flex-wrap">
      {% for badge_name, badge_img in user_badges.items() %}
        <div class="flex flex-col items-center">
          <img src="{{ url_for('static', filename='images/' + badge_img) }}" class="badge w-24 mb-2" alt="{{ badge_name }}">
          <span class="font-medium">{{ badge_name }}</span>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <p class="text-gray-500">You haven’t unlocked any badges yet. Complete activities or quizzes to earn badges!</p>
  {% endif %}

</div>
{% endblock %}
