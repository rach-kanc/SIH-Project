{% extends "base.html" %}

{% block content %}
<div class="text-center">
    <h1 class="text-2xl font-bold mb-6 text-green-700">🏆 Leaderboard</h1>
    <table class="mx-auto border-collapse w-2/3">
        <thead>
            <tr class="bg-green-200">
                <th class="border p-2">Rank</th>
                <th class="border p-2">Name</th>
                <th class="border p-2">XP</th>
            </tr>
        </thead>
        <tbody>
            {% for idx, player in enumerate(leaderboard, start=1) %}
            <tr class="hover:bg-green-100">
                <td class="border p-2">{{ idx }}</td>
                <td class="border p-2">{{ player.name }}</td>
                <td class="border p-2">{{ player.xp }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
