{% extends "base.html" %}

{% block content %}
<div class="text-center">
    <h1 class="text-2xl font-bold mb-6 text-green-700">🌍 Quiz Time!</h1>
    <form method="POST" class="bg-white p-6 rounded-lg shadow-lg inline-block">
        <p class="mb-4">Q: What is the most water-efficient method of irrigation?</p>
        <input type="radio" name="q1" value="drip"> Drip Irrigation <br>
        <input type="radio" name="q1" value="flood"> Flood Irrigation <br>
        <input type="radio" name="q1" value="sprinkler"> Sprinkler Irrigation <br><br>
        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">Submit</button>
    </form>
</div>
{% endblock %}
