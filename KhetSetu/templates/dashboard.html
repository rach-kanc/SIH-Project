{% extends "base.html" %}
{% block content %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">

  <!-- Farmer XP -->
  <div class="bg-white p-6 rounded-2xl shadow-lg">
    <h2 class="text-xl font-bold mb-4">Your Progress 🌱</h2>
    <p class="mb-2">XP Points: <span id="xp-points">{{ xp }}</span></p>

    <!-- XP Progress Bar -->
    <div class="bg-gray-200 rounded-full h-4 w-full mb-4">
      <div id="xp-bar" class="bg-green-500 h-4 rounded-full" style="width: {{ xp }}%"></div>
    </div>

    <!-- XP Tree (height controlled via JS) -->
    <img src="{{ url_for('static', filename='images/tree.png') }}"
         id="xp-tree"
         class="mx-auto transition-all duration-500" />
  </div>

  <!-- Activities -->
  <div class="bg-white p-6 rounded-2xl shadow-lg">
    <h2 class="text-xl font-bold mb-4">Today’s Activities 🚜</h2>
    <ul class="space-y-3">
      <li class="p-3 bg-green-100 rounded-lg">♻️ Segregated Waste Properly</li>
      <li class="p-3 bg-green-100 rounded-lg">🌾 Used Organic Fertilizer</li>
      <li class="p-3 bg-green-100 rounded-lg">💧 Optimized Water Usage</li>
    </ul>
  </div>

</div>
{% endblock %}
